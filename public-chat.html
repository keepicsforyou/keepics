<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta property="og:title" content="Official KeePics website.">
    <meta property="og:description" content="KeePics offers customizable aesthetic keychain.">
    
    
    
    
    
    <meta http-equiv="Cache-Control" content="public, max-age=31536000">

    <link class="retained-favicon" rel="icon" type="image/png" href="assets/image/website/logo.png">
    <link rel="stylesheet" href="styles/styles.css?v=1.0.0">
    <title>KeePics. - Lounge</title>
    
</head>
<body class="chat-body">
    <nav class="navbar">
        <div class="isx-22" >
            <a class="isx-23" href="features.html" >
                <svg class="isx-2" viewBox="0 0 24 24" width="20px" height="20px" fill="currentColor"  aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </a>
            <div class="logo isx-24" >KeePics.</div>
        </div>
        
        <div class="isx-25" id="hamburger-menu" >
            <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </div>
        
        <ul class="nav-links isx-26" id="nav-menu" >
            <li>
                <a class="isx-27" href="features.html" >
                    Exit Lounge
                </a>
            </li>
        </ul>
    </nav>

    <section class="hero">
        <div class="chat-main-wrapper">
            <div class="isx-28" >
                <div class="isx-29" >
                    <div class="isx-22" >
                        <div class="chat-header-avatar-container">
                            <img id="chat-room-avatar-frame" src="assets/image/website/logo.png" alt="Group Icon">
                        </div>
                        <div>
                            <div class="isx-30" >
                                <h2 class="isx-31" id="lounge-room-display-title" >Loading...</h2>
                                <span class="isx-32" id="admin-rename-action-trigger"  onclick="window.promptChangeChatName()">
                                    <svg class="isx-2" viewBox="0 0 24 24" width="16px" height="16px" fill="currentColor"  aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                                </span>
                            </div>
                            <span class="isx-33" >Lounge</span>
                        </div>
                    </div>
                    <div>
                        <button class="isx-34" onclick="toggleSidebarView()" >
                            <svg class="isx-2" viewBox="0 0 24 24" width="24px" height="24px" fill="currentColor"  aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                        </button>
                    </div>
                </div>

                <input type="file" id="chat-avatar-file-input" accept="image/*" style="display: none;">

                <div class="isx-35" id="chat-messages-area" ></div>
                
                <div class="isx-36" id="attached-image-preview-area" ></div>

                <div id="sticker-drawer" class="sticker-drawer-popup">
                    <div class="isx-37" >
                        <div class="isx-38" >
                            <span class="isx-39" >Stickers Pack</span>
                            
                            <select class="isx-40" id="sticker-pack-user-selector" ></select>
                            
                            <label class="isx-41" id="custom-sticker-upload-label" for="custom-sticker-upload-input" >
                                <svg class="isx-2" viewBox="0 0 24 24" width="12px" height="12px" fill="currentColor"  aria-hidden="true"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg> Upload Custom
                            </label>
                            <input type="file" id="custom-sticker-upload-input" accept="image/*" style="display: none;">
                        </div>
                        <input type="text" id="stk-search-query-field" class="drawer-search-bar" placeholder="Search open-source pack...">
                    </div>
                    <div class="sticker-picker-tabs">
                        <button class="drawer-tab-btn active" id="stk-tab-opensource" onclick="switchStickerTab('opensource')">OpenSource</button>
                        <button class="drawer-tab-btn" id="stk-tab-favs" onclick="switchStickerTab('favs')">Favorites</button>
                        <button class="drawer-tab-btn" id="stk-tab-custom" onclick="switchStickerTab('custom')">My Packs</button>
                    </div>
                    <div id="sticker-grid-container" class="media-drawer-grid"></div>
                </div>

                <div id="global-emoji-picker" class="global-emoji-picker-drawer">
                    <div id="emoji-picker-categories-header" class="emoji-picker-tabs"></div>
                    <div id="emoji-picker-grid-container" class="emoji-picker-grid"></div>
                </div>

                <div class="isx-42" >
                    <div class="isx-43" id="reply-preview-container" >
                        <div class="isx-44" >
                            <div class="isx-45" id="reply-to-name" ></div>
                            <div class="isx-46" id="reply-to-text" ></div>
                        </div>
                        <button class="isx-47" onclick="window.cancelReply()" ><svg viewBox="0 0 24 24" width="18px" height="18px" fill="currentColor" aria-hidden="true"><path d="M18.3 5.71L12 12l6.3 6.29-1.41 1.42L10.59 13.41 4.3 19.71 2.88 18.29 9.17 12 2.88 5.71 4.3 4.29l6.29 6.3 6.29-6.3z" transform="translate(1.5 0) scale(0.88)"/></svg></button>
                    </div>

                    <div class="isx-48" >
                        <button class="isx-49" onclick="document.getElementById('chat-image-file-input').click()" >
                            <svg class="isx-2" viewBox="0 0 24 24" width="24px" height="24px" fill="currentColor"  aria-hidden="true"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                        </button>
                        <input type="file" id="chat-image-file-input" accept="image/*" style="display: none;">

                        <button class="isx-49" id="sticker-drawer-trigger-btn" >
                            <svg class="isx-2" viewBox="0 0 24 24" width="24px" height="24px" fill="currentColor"  aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
                        </button>

                        <textarea class="isx-50" id="chat-input-field" placeholder="Type a message..." rows="1" ></textarea>
                        
                        <button class="isx-51" id="send-chat-btn" >
                            <svg class="isx-2" viewBox="0 0 24 24" width="24px" height="24px" fill="currentColor"  aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <div id="chat-contextual-sidebar" style="display: none;">
                <div class="isx-52" >
                    <h3 class="isx-53" >Room Details</h3>
                    <button class="isx-54" onclick="toggleSidebarView()" ><svg viewBox="0 0 24 24" width="18px" height="18px" fill="currentColor" aria-hidden="true"><path d="M18.3 5.71L12 12l6.3 6.29-1.41 1.42L10.59 13.41 4.3 19.71 2.88 18.29 9.17 12 2.88 5.71 4.3 4.29l6.29 6.3 6.29-6.3z" transform="translate(1.5 0) scale(0.88)"/></svg></button>
                </div>
                <div class="isx-55" >
                    <div>
                        <span class="isx-56" >Channel Settings</span>
                        <div class="preference-config-container">
                            <div class="isx-57" >Reaction Shortcuts (Tap to rebind)</div>
                            <div class="pref-slots">
                                <button id="pref-node-0" class="pref-slot-node" onclick="openGlobalEmojiPickerForSlot(0)"></button>
                                <button id="pref-node-1" class="pref-slot-node" onclick="openGlobalEmojiPickerForSlot(1)"></button>
                                <button id="pref-node-2" class="pref-slot-node" onclick="openGlobalEmojiPickerForSlot(2)"></button>
                                <button id="pref-node-3" class="pref-slot-node" onclick="openGlobalEmojiPickerForSlot(3)"></button>
                                <button id="pref-node-4" class="pref-slot-node" onclick="openGlobalEmojiPickerForSlot(4)"></button>
                                <button id="pref-node-5" class="pref-slot-node" onclick="openGlobalEmojiPickerForSlot(5)"></button>
                            </div>
                        </div>
                    </div>

                    <div>
                        <span class="isx-56" >Shared Media</span>
                        <div class="isx-58" id="media-deck-gallery" ></div>
                    </div>

                    <div class="isx-59" id="admin-exclusive-dashboard" >
                        <span class="isx-60" >Admin Customization Options</span>
                        <div class="isx-61" >
                            <button class="isx-62" onclick="window.promptChangeChatName()" >
                                <svg class="isx-2" viewBox="0 0 24 24" width="16px" height="16px" fill="currentColor"  aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg> Update Channel Name
                            </button>
                            <button class="isx-62" onclick="document.getElementById('chat-avatar-file-input').click()" >
                                <svg class="isx-2" viewBox="0 0 24 24" width="16px" height="16px" fill="currentColor"  aria-hidden="true"><path d="M12 12c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm9-8h-2.17l-1.83-1.83c-.37-.37-.88-.58-1.41-.58H8.41c-.53 0-1.05.21-1.42.58L5.17 4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-9 16c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg> Update Channel Avatar
                            </button>
                            <button class="isx-63" onclick="window.clearAllChatHistory()" >
                                <svg class="isx-2" viewBox="0 0 24 24" width="16px" height="16px" fill="currentColor"  aria-hidden="true"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM8 9h8v10H8V9zm7.5-5l-1-1h-5l-1 1H5v2h14V4h-3.5z"/></svg> Wipe Chat Records
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="zoom-lightbox" class="zoom-lightbox-modal" onclick="closeImagePopUpModal()">
        <span class="zoom-lightbox-close" onclick="closeImagePopUpModal()"><svg viewBox="0 0 24 24" width="18px" height="18px" fill="currentColor" aria-hidden="true"><path d="M18.3 5.71L12 12l6.3 6.29-1.41 1.42L10.59 13.41 4.3 19.71 2.88 18.29 9.17 12 2.88 5.71 4.3 4.29l6.29 6.3 6.29-6.3z" transform="translate(1.5 0) scale(0.88)"/></svg></span>
        <img class="zoom-lightbox-content" id="zoom-lightbox-img" onclick="event.stopPropagation()">
        <button id="zoom-lightbox-dl-btn" class="zoom-lightbox-download">
            <svg class="isx-2" viewBox="0 0 24 24" width="24px" height="24px" fill="currentColor"  aria-hidden="true"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> Save Asset
        </button>
    </div>
    
    <div id="admin-sticker-modal" class="zoom-lightbox-modal isx-64" >
        <div class="isx-65" >
            <span class="isx-66"  onclick="document.getElementById('admin-sticker-modal').style.display='none'"><svg viewBox="0 0 24 24" width="18px" height="18px" fill="currentColor" aria-hidden="true"><path d="M18.3 5.71L12 12l6.3 6.29-1.41 1.42L10.59 13.41 4.3 19.71 2.88 18.29 9.17 12 2.88 5.71 4.3 4.29l6.29 6.3 6.29-6.3z" transform="translate(1.5 0) scale(0.88)"/></svg></span>
            <h3 class="isx-67" >Manage Custom Stickers</h3>
            <div class="isx-68" id="admin-sticker-grid" ></div>
        </div>
    </div>

    <div id="mobile-action-backdrop" class="mobile-bottom-bar-backdrop"></div>

    <div id="mobile-action-sheet" class="mobile-bottom-bar">
        <div class="isx-69" ></div>
        <button id="mobile-action-reply" class="mobile-bar-btn">
            <svg class="isx-2" viewBox="0 0 24 24" width="24px" height="24px" fill="currentColor"  aria-hidden="true"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/></svg> Reply
        </button>
        <button id="mobile-action-delete" class="mobile-bar-btn delete">
            <svg class="isx-2" viewBox="0 0 24 24" width="24px" height="24px" fill="currentColor"  aria-hidden="true"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg> Delete Message
        </button>
    </div>

    <script type="module">
        import { initLoungeChatSystem } from './assets/database/public-chat.js';
        initLoungeChatSystem(
            'lounge-room-display-title', 
            'admin-rename-action-trigger', 
            'chat-messages-area', 
            'chat-input-field', 
            'send-chat-btn', 
            'chat-image-file-input', 
            'attached-image-preview-area',
            'chat-room-avatar-frame',   
            'chat-avatar-file-input'
        );
    </script>
    <script type="module">
        import { handleNavbarAuth } from './assets/database/firebase-config.js';
        handleNavbarAuth('auth-status');    
    </script>
    <script>
        // Maintained background click interceptor to ensure module compilation stability 
        const hamburger = document.getElementById('hamburger-menu');
        const navMenu = document.getElementById('nav-menu');
        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
        });
    </script>
</body>
</html>
