name: Ping Database
description: This would make the database ping every 5 days, so it will not turn off inactivity

on:
  schedule:
    # Runs at 00:00 every 5 days to ensure it pings well before the 7-day inactivity limit
    - cron: '0 0 */5 * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab if needed

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Dropbox Token Edge Function
        run: |
          curl -X POST https://zyaqsvvmtxcgpkjhjiqf.supabase.co/functions/v1/dropbox-token \
          -H "Content-Type: application/json" \
          -d '{}'
