<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/image/website/logo.png">
    <link rel="stylesheet" href="styles/styles.css">
    <title>KeePics - Authentication</title>
    <style>
        .auth-container {
            max-width: 420px;
            margin: 40px auto;
            padding: 32px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-header h2 {
            margin: 0 0 8px 0;
            font-size: 1.6rem;
        }

        .login-subtitle {
            color: #666;
            font-size: 0.9rem;
            margin: 0;
        }

        .google-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 16px;
            border: 1px solid #dadce0;
            border-radius: 6px;
            background: #ffffff;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s ease;
        }

        .google-btn:hover {
            background: #f8f9fa;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #888;
            font-size: 0.85rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }

        .divider::before { margin-right: 12px; }
        .divider::after { margin-left: 12px; }

        .form-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }

        .name-fields-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 0.85rem;
            color: #555;
            user-select: none;
        }

        .forgot-link-container {
            text-align: right;
            margin-top: 6px;
        }

        .forgot-link-container span {
            font-size: 0.85rem;
            color: #0066cc;
            cursor: pointer;
        }

        .forgot-link-container span:hover {
            text-decoration: underline;
        }

        .error-message, .success-message {
            display: none;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        .error-message {
            background-color: #fde8e8;
            color: #9b1c1c;
            border: 1px solid #f8b4b4;
        }

        .success-message {
            background-color: #def7ec;
            color: #03543f;
            border: 1px solid #84e1bc;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
        }

        .submit-btn:disabled, .google-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .switch-mode-text {
            text-align: center;
            margin-top: 16px;
            font-size: 0.9rem;
        }

        .switch-mode-text span {
            color: #0066cc;
            cursor: pointer;
            font-weight: 500;
        }

        .switch-mode-text span:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="login-page">
    <nav class="navbar">
        <div class="logo">KeePics.</div>
        
        <div class="hamburger" id="hamburger-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>

        <ul class="nav-links" id="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="order.html">Order</a></li>
            <li><a href="features.html">Features</a></li>
            <li id="auth-status"><a href="login.html" class="active">Login</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="about.html">About</a></li>        
        </ul>
    </nav>

    <section class="login-hero">
        <div class="auth-container">
            <div class="auth-header">
                <h2 id="form-title">Sign in</h2>
                <p id="form-subtitle" class="login-subtitle">Welcome back — let's keep your memories safe.</p>
            </div>

            <div id="social-block">
                <button type="button" id="google-auth-btn" class="google-btn">
                    <svg class="google-icon" viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
                    <span>Continue with Google</span>
                </button>
                <div class="divider" id="social-divider">or use your email</div>
            </div>

            <form id="auth-form" novalidate>
                <div class="name-fields-container" id="name-fields" style="display: none;">
                    <div class="form-group">
                        <input type="text" id="first-name" placeholder="First name">
                    </div>
                    <div class="form-group">
                        <input type="text" id="last-name" placeholder="Last name">
                    </div>
                </div>

                <div class="form-group">
                    <input type="email" id="email" placeholder="Email address" required>
                </div>
                
                <div id="password-group">
                    <div class="form-group password-container">
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <span class="toggle-password" id="eye-icon">Show</span>
                    </div>

                    <div class="forgot-link-container">
                        <span id="forgot-password-trigger">Forgot password?</span>
                    </div>
                </div>

                <div id="error-box" class="error-message">
                    <span id="error-text"></span>
                </div>

                <div id="success-box" class="success-message">
                    <span id="success-text"></span>
                </div>

                <div class="form-actions">
                    <button type="submit" id="main-submit-btn" class="submit-btn">Sign in</button>
                    <div class="switch-mode-text">
                        <span id="toggle-auth-mode">Create account</span>
                    </div>
                </div>
            </form>
        </div>
    </section>
    
    <script>
        const hamburger = document.getElementById('hamburger-menu');
        const navMenu = document.getElementById('nav-menu');
        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
        });
    </script>

    <script type="module">
        import { 
            auth, 
            googleProvider,
            signInWithPopup,
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword,
            updateProfile,
            sendPasswordResetEmail,
            sendEmailVerification,
            handleNavbarAuth,
            db
        } from './assets/database/firebase-config.js';
        
        import { ref, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // Capture previous URL parameter or referrer upon loading the page
        const urlParams = new URLSearchParams(window.location.search);
        const redirectParam = urlParams.get('redirect');
        
        if (document.referrer && !document.referrer.includes('login.html') && !sessionStorage.getItem('returnUrl')) {
            sessionStorage.setItem('returnUrl', document.referrer);
        } else if (redirectParam) {
            sessionStorage.setItem('returnUrl', redirectParam);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                redirectUser();
            }
        });

        if (typeof handleNavbarAuth === 'function') {
            handleNavbarAuth('auth-status');
        }

        const authForm = document.getElementById('auth-form');
        const formTitle = document.getElementById('form-title');
        const formSubtitle = document.getElementById('form-subtitle');
        const mainSubmitBtn = document.getElementById('main-submit-btn');
        const toggleAuthModeBtn = document.getElementById('toggle-auth-mode');
        const errorBox = document.getElementById('error-box');
        const errorText = document.getElementById('error-text');
        const successBox = document.getElementById('success-box');
        const successText = document.getElementById('success-text');
        const googleAuthBtn = document.getElementById('google-auth-btn');
        const socialBlock = document.getElementById('social-block');
        
        const passwordGroup = document.getElementById('password-group');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');
        
        const nameFields = document.getElementById('name-fields');
        const firstNameInput = document.getElementById('first-name');
        const lastNameInput = document.getElementById('last-name');
        const forgotPasswordTrigger = document.getElementById('forgot-password-trigger');

        let currentMode = 'login';

        const displayStatus = (err, successMsg = "") => {
            errorText.textContent = "";
            errorBox.style.display = "none";
            successText.textContent = "";
            successBox.style.display = "none";

            if (err) {
                const errorCode = err.code || err.message || "";
                let humanReadableMessage = "An unexpected error occurred. Please try again.";

                if (errorCode.includes('invalid-credential') || errorCode.includes('wrong-password')) {
                    humanReadableMessage = "Wrong password or email. Please check your credentials.";
                } else if (errorCode.includes('user-not-found')) {
                    humanReadableMessage = "No account found with this email address.";
                } else if (errorCode.includes('invalid-email')) {
                    humanReadableMessage = "Please enter a valid email address.";
                } else if (errorCode.includes('email-already-in-use')) {
                    humanReadableMessage = "This email is already registered.";
                } else if (errorCode.includes('weak-password')) {
                    humanReadableMessage = "Password should be at least 6 characters long.";
                } else if (errorCode.includes('too-many-requests')) {
                    humanReadableMessage = "Too many failed attempts. Try again later.";
                } else if (typeof err === 'string') {
                    humanReadableMessage = err;
                }

                errorText.textContent = humanReadableMessage;
                errorBox.style.display = "block";
            }

            if (successMsg) {
                successText.textContent = successMsg;
                successBox.style.display = "block";
            }
        };

        const redirectUser = () => {
            const returnUrl = sessionStorage.getItem('returnUrl');
            sessionStorage.removeItem('returnUrl');

            if (returnUrl && !returnUrl.includes('login.html')) {
                window.location.href = returnUrl;
            } else {
                window.location.href = "index.html";
            }
        };

        function saveUserToRegistry(user, customName = null) {
            if (!db) return Promise.resolve();
            const userRef = ref(db, `users/${user.uid}`);
            const updates = {
                uid: user.uid,
                email: user.email,
                displayName: customName || user.displayName || user.email.split('@')[0],
                lastLogin: Date.now()
            };
            return update(userRef, updates).catch(err => console.error("Database update error:", err));
        }

        const switchAuthMode = (targetMode) => {
            currentMode = targetMode;
            displayStatus(null);

            if (currentMode === 'login') {
                formTitle.textContent = "Sign in";
                formSubtitle.textContent = "Welcome back — let's keep your memories safe.";
                mainSubmitBtn.textContent = "Sign in";
                toggleAuthModeBtn.textContent = "Create account";
                
                socialBlock.style.display = "block";
                nameFields.style.display = "none";
                passwordGroup.style.display = "block";
            } 
            else if (currentMode === 'signup') {
                formTitle.textContent = "Create account";
                formSubtitle.textContent = "Sign up to start saving your memories.";
                mainSubmitBtn.textContent = "Sign up";
                toggleAuthModeBtn.textContent = "Sign in instead";
                
                socialBlock.style.display = "block";
                nameFields.style.display = "grid";
                passwordGroup.style.display = "block";
            } 
            else if (currentMode === 'forgot') {
                formTitle.textContent = "Account recovery";
                formSubtitle.textContent = "Enter your email to receive a password reset link.";
                mainSubmitBtn.textContent = "Send Link";
                toggleAuthModeBtn.textContent = "Back to Sign in";
                
                socialBlock.style.display = "none";
                nameFields.style.display = "none";
                passwordGroup.style.display = "none";
            }
        };

        eyeIcon.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = 'Hide';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = 'Show';
            }
        });

        toggleAuthModeBtn.addEventListener('click', () => {
            if (currentMode === 'login' || currentMode === 'forgot') {
                switchAuthMode('signup');
            } else {
                switchAuthMode('login');
            }
        });

        forgotPasswordTrigger.addEventListener('click', () => {
            switchAuthMode('forgot');
        });

        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;
            displayStatus(null);

            if (!email) {
                displayStatus("Please enter an email address.");
                return;
            }

            mainSubmitBtn.disabled = true;
            const originalBtnText = mainSubmitBtn.textContent;
            mainSubmitBtn.textContent = "Processing...";

            if (currentMode === 'login') {
                if (!password) {
                    displayStatus("Please enter your password.");
                    mainSubmitBtn.disabled = false;
                    mainSubmitBtn.textContent = originalBtnText;
                    return;
                }

                signInWithEmailAndPassword(auth, email, password)
                    .then((userCredential) => { 
                        saveUserToRegistry(userCredential.user);
                        redirectUser();
                    })
                    .catch((err) => { 
                        displayStatus(err); 
                        mainSubmitBtn.disabled = false;
                        mainSubmitBtn.textContent = originalBtnText;
                    });
            } 
            else if (currentMode === 'signup') {
                const firstName = firstNameInput.value.trim();
                const lastName = lastNameInput.value.trim();

                if (!firstName || !lastName) {
                    displayStatus("Please fill in both first and last name.");
                    mainSubmitBtn.disabled = false;
                    mainSubmitBtn.textContent = originalBtnText;
                    return;
                }

                if (!password) {
                    displayStatus("Please provide a password.");
                    mainSubmitBtn.disabled = false;
                    mainSubmitBtn.textContent = originalBtnText;
                    return;
                }

                const fullName = `${firstName} ${lastName}`;
                
                createUserWithEmailAndPassword(auth, email, password)
                    .then((userCredential) => {
                        return updateProfile(userCredential.user, { displayName: fullName })
                            .then(() => userCredential.user);
                    })
                    .then((user) => {
                        sendEmailVerification(user);
                        return saveUserToRegistry(user, fullName);
                    })
                    .then(() => { 
                        localStorage.setItem('isLoggedIn', 'true');
                        localStorage.setItem('displayName', fullName);
                        displayStatus(null, "Account created! Check your email for a verification link.");
                        setTimeout(() => { redirectUser(); }, 3500);
                    })
                    .catch((err) => { 
                        displayStatus(err); 
                        mainSubmitBtn.disabled = false;
                        mainSubmitBtn.textContent = originalBtnText;
                    });
            } 
            else if (currentMode === 'forgot') {
                sendPasswordResetEmail(auth, email)
                    .then(() => {
                        displayStatus(null, "Password reset link sent! Check your inbox.");
                        mainSubmitBtn.disabled = false;
                        mainSubmitBtn.textContent = originalBtnText;
                    })
                    .catch((err) => { 
                        displayStatus(err); 
                        mainSubmitBtn.disabled = false;
                        mainSubmitBtn.textContent = originalBtnText;
                    });
            }
        });

        googleAuthBtn.addEventListener('click', () => {
            displayStatus(null);
            
            const originalGoogleHtml = googleAuthBtn.innerHTML;
            googleAuthBtn.disabled = true;
            googleAuthBtn.innerHTML = "<span>Connecting...</span>";
            
            signInWithPopup(auth, googleProvider)
                .then((result) => {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('displayName', result.user.displayName || '');
                    saveUserToRegistry(result.user);
                    redirectUser();
                })
                .catch((err) => { 
                    displayStatus(err); 
                    googleAuthBtn.disabled = false;
                    googleAuthBtn.innerHTML = originalGoogleHtml;
                });
        });
    </script>
</body>
</html>
