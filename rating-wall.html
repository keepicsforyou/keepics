<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
    <link rel="icon" type="image/png" href="assets/image/website/logo.png">
    <link rel="stylesheet" href="styles/styles.css">
    <title>KeePics - Reviews Wall</title>
    <style>
        .review-image-upload {
            margin: 12px 0;
        }
        .review-image-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }
        .review-image-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
        }
        .review-image-label svg {
            flex-shrink: 0;
        }
        .review-image-preview {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px dashed #dee2e6;
        }
        .review-image-preview img {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .remove-image-btn:hover {
            background: #9a2d3a !important;
        }
    </style>
</head>
<body class="rating-wall-page">

    <nav class="navbar">
        <div class="logo">KeePics.</div>
        
        <div class="hamburger" id="hamburger-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>

        <ul class="nav-links" id="nav-menu">
            <li><a href="features.html">Go Back</a></li>
            <li id="auth-status"><a href="login.html">Login</a></li>  
        </ul>
    </nav>


        <div class="wall-container">
            <section class="action-card">
                <h2>Community Feedback</h2>
                <p>Loved your custom keychain? Let us know!</p>
                <button class="write-review-btn" id="open-review-modal"><svg viewBox="0 0 24 24" width="18px" height="18px" fill="currentColor" aria-hidden="true"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg> Post a Review</button>
            </section>

            <main class="reviews-feed">
                <div id="ratings-display-target">
                </div>
            </main>
        </div>
    </div>

    <div class="modal-overlay" id="review-modal">
        <section class="comments-section">
            <button class="close-modal-btn" id="close-review-modal">&times;</button>
            
            <h3>Product Reviews</h3>
            <p class="subtitle">Select your star rating below:</p>
            
            <div class="star-rating-selector" id="star-container">
                <span data-value="1"><svg viewBox="0 0 24 24" width="28px" height="28px" fill="currentColor" aria-hidden="true"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></span>
                <span data-value="2"><svg viewBox="0 0 24 24" width="28px" height="28px" fill="currentColor" aria-hidden="true"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></span>
                <span data-value="3"><svg viewBox="0 0 24 24" width="28px" height="28px" fill="currentColor" aria-hidden="true"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></span>
                <span data-value="4"><svg viewBox="0 0 24 24" width="28px" height="28px" fill="currentColor" aria-hidden="true"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></span>
                <span data-value="5"><svg viewBox="0 0 24 24" width="28px" height="28px" fill="currentColor" aria-hidden="true"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></span>
            </div>

            <div class="review-image-upload">
                <label for="review-image-input" class="review-image-label" id="review-image-label">
                    <svg viewBox="0 0 24 24" width="18px" height="18px" fill="currentColor" aria-hidden="true"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                    Attach Photo
                </label>
                <input type="file" id="review-image-input" accept="image/*" hidden>
                <div id="review-image-preview" class="review-image-preview"></div>
            </div>

            <div class="fb-comment-box">
                <input type="text" id="main-rating-field" placeholder="Share your experience with KeePics..." autocomplete="off">
                <button id="submit-review-btn">Publish Review</button>
            </div>
        </section>
    </div>

    <script type="module">
        import { handleNavbarAuth, initCommentsSystem } from './assets/database/firebase-config.js';

        handleNavbarAuth('auth-status');
        initCommentsSystem('ratings-display-target');
    </script>

    <script>
        const hamburger = document.getElementById('hamburger-menu');
        const navMenu = document.getElementById('nav-menu');

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
        });

        const reviewModal = document.getElementById('review-modal');
        const openModalBtn = document.getElementById('open-review-modal');
        const closeModalBtn = document.getElementById('close-review-modal');

        openModalBtn.addEventListener('click', () => {
            reviewModal.classList.add('active');
            currentRating = 5;
            highlightStars(5);
            if (typeof window.setRating === 'function') {
                window.setRating(5);
            }
        });

        closeModalBtn.addEventListener('click', () => {
            closeModalWindow();
        });

        reviewModal.addEventListener('click', (e) => {
            if (e.target === reviewModal) closeModalWindow();
        });

        function closeModalWindow() {
            reviewModal.classList.remove('active');
            currentRating = 0;
            highlightStars(0);
            document.getElementById('main-rating-field').value = '';
        }

        let currentRating = 0;
        const stars = document.querySelectorAll('#star-container span');

        stars.forEach(star => {
            star.addEventListener('click', () => {
                currentRating = parseInt(star.getAttribute('data-value'));
                highlightStars(currentRating);
                
                if (typeof window.setRating === 'function') {
                    window.setRating(currentRating);
                }
            });
        });

        function highlightStars(rating) {
            stars.forEach(star => {
                const starValue = parseInt(star.getAttribute('data-value'));
                if (starValue <= rating) {
                    star.classList.add('selected');
                } else {
                    star.classList.remove('selected');
                }
            });
        }

        // Image upload preview handling
        const reviewImageInput = document.getElementById('review-image-input');
        const reviewImageLabel = document.getElementById('review-image-label');
        const reviewImagePreview = document.getElementById('review-image-preview');

        reviewImageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                // Validate file size (max 2MB)
                if (file.size > 2 * 1024 * 1024) {
                    alert("Image file is too large! Please choose an image smaller than 2MB.");
                    this.value = "";
                    return;
                }
                
                // Validate file type
                if (!file.type.startsWith('image/')) {
                    alert("Please select a valid image file.");
                    this.value = "";
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(event) {
                    reviewImagePreview.innerHTML = `
                        <img src="${event.target.result}" alt="Preview" style="max-width: 100%; max-height: 200px; border-radius: 8px;">
                        <button type="button" class="remove-image-btn" onclick="removeReviewImage()" style="margin-top: 8px; padding: 4px 12px; background: #B73B49; color: white; border: none; border-radius: 4px; cursor: pointer;">Remove</button>
                    `;
                    reviewImageLabel.innerHTML = `
                        <svg viewBox="0 0 24 24" width="18px" height="18px" fill="currentColor" aria-hidden="true"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                        Change Photo
                    `;
                };
                reader.readAsDataURL(file);
            }
        });

        window.removeReviewImage = function() {
            reviewImageInput.value = "";
            reviewImagePreview.innerHTML = "";
            reviewImageLabel.innerHTML = `
                <svg viewBox="0 0 24 24" width="18px" height="18px" fill="currentColor" aria-hidden="true"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                Attach Photo
            `;
        };

        document.getElementById('submit-review-btn').addEventListener('click', async () => {
            if (currentRating === 0) {
                alert('Please select a star rating before submitting!');
                return;
            }

            const inputField = document.getElementById('main-rating-field');
            if (!inputField.value.trim()) {
                alert('Please type a comment before publishing!');
                return;
            }

            try {
                if (typeof window.submitComment === 'function') {
                    await window.submitComment('main-rating-field', 'review-image-input');
                    closeModalWindow();
                    // Reset image preview after successful submit
                    window.removeReviewImage();
                } else {
                    alert("Database engine down. Please try again later.");
                }
            } catch (error) {
                console.error("Error saving review: ", error);
                alert("Something went wrong saving your review. Please try again.");
            }
        });
    </script>
</body>
</html>
